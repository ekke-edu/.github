name: Smart Welcome Bot

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Analyze User & Comment
        uses: actions/github-script@v7
        with:
          script: |
            const username = context.payload.sender.login;
            const issueNumber = context.payload.issue?.number || context.payload.pull_request.number;
            const isPR = context.payload.pull_request !== undefined;
            const actionType = isPR ? 'Pull Requestet' : 'Issue-t';

            // 1. Jogosultság ellenőrzése a repón
            let permissionLevel = 'student';
            try {
              const permResponse = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: username,
              });
              permissionLevel = permResponse.data.permission;
            } catch (error) {
              console.log("Nem sikerült lekérdezni a jogosultságot, alapértelmezett szint.");
            }

            // 2. Szerepkör alapú üzenet
            let roleSpecificMessage = "";
            if (permissionLevel === 'admin' || permissionLevel === 'write') {
              roleSpecificMessage = "🔒 *Megjegyzés: Te írási jogosultsággal rendelkezel (Oktató/Segítő státusz).*";
            } else {
              roleSpecificMessage = "💻 *Hallgatói státusz észlelve. Kérjük, ügyelj a Fork & Pull Request munkafolyamatra!*";
            }

            // 3. Üzenet összeállítása
            const body = `Szia @${username}! 👋 Köszönjük, hogy ${actionType} nyitottál.

${roleSpecificMessage}

Kérjük, mielőtt továbbhaladsz, ellenőrizd az alábbiakat:
- 📖 Olvastad a [Contributing Guidelines](https://github.com/ekke-edu/.github/blob/main/profile/README.md)-t?
- 💬 Ha elakadtál vagy kérdésed van, nézz szét a szervezet [GitHub Discussions](https://github.com/orgs/ekke-edu/discussions) felületén!
- 🔒 Biztonsági kérdésekben lásd a [SECURITY.md](https://github.com/ekke-edu/.github/blob/main/profile/SECURITY.md) irányelveit.

Sikeres munkát kívánunk! 🚀`;

            // 4. Komment elküldése
            await github.rest.issues.createComment({
              issue_number: issueNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
