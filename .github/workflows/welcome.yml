name: Smart Welcome Bot

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]
  discussion:
    types: [created]

jobs:
  welcome:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      discussions: write
      contents: read
    steps:
      - name: Welcome Commenter
        uses: actions/github-script@v7
        with:
          script: |
            const username = context.actor;
            const eventName = context.eventName;
            
            let actionType = 'bejegyzést';
            if (eventName === 'issues') actionType = 'Issue-t';
            if (eventName === 'pull_request') actionType = 'Pull Requestet';
            if (eventName === 'discussion') actionType = 'Discussion témát';

            // 1. Jogosultság ellenőrzése a repón
            let permissionLevel = 'student';
            try {
              const permResponse = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: username,
              });
              permissionLevel = permResponse.data.permission;
            } catch (error) {
              console.log("Jogosultság lekérdezése sikertelen, alapértelmezett szint.");
            }

            // 2. Szerepkör alapú üzenet
            let roleSpecificMessage = "";
            if (permissionLevel === 'admin' || permissionLevel === 'write') {
              roleSpecificMessage = "🔒 *Megjegyzés: Te írási jogosultsággal rendelkezel (Oktató/Segítő státusz).*";
            } else {
              roleSpecificMessage = "💻 *Hallgatói státusz észlelve. Kérjük, ügyelj a Fork & Pull Request munkafolyamatra!*";
            }

            // 3. Üzenet összeállítása (Array alapú megközelítés a YAML hibák elkerülésére)
            const welcomeMessage = [
              `Szia @${username}! 👋 Köszönjük, hogy ${actionType} nyitottál.`,
              '',
              roleSpecificMessage,
              '',
              'Kérjük, ellenőrizd az alábbi hivatalos útmutatókat:',
              '- 📖 Olvastad a [Contributing Guidelines](https://github.com/ekke-edu/.github/blob/main/profile/README.md)-t?',
              '- 💬 Böngéssz a többi téma között a szervezet [GitHub Discussions](https://github.com/orgs/ekke-edu/discussions) felületén!',
              '- 🔒 Biztonsági kérdésekben lásd a [SECURITY.md](https://github.com/ekke-edu/.github/blob/main/profile/SECURITY.md) irányelveit.',
              '',
              'Sikeres munkát kívánunk! 🚀'
            ].join('\n');

            // 4. Komment elküldése
            if (eventName === 'discussion') {
              // GraphQL mutáció a Discussions felülethez
              const query = `mutation($discussionId: ID!, $body: String!) {
                addDiscussionComment(input: {discussionId: $discussionId, body: $body}) {
                  clientMutationId
                }
              }`;
              const variables = {
                discussionId: context.payload.discussion.node_id,
                body: welcomeMessage
              };
              await github.graphql(query, variables);
            } else {
              // REST API az Issue-khoz és PR-okhoz
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: welcomeMessage
              });
            }
